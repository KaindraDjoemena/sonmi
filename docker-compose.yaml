services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2222:2222"
      - "8080:8080"
    environment:
      - APP_ENV=production
    volumes:
      - ./sonmi-data:/root/sonmi-data
      - ./.ssh:/root/.ssh
      - ./config.yaml:/root/config.yaml
    restart: unless-stopped
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config/passwd:/mosquitto/config/passwd
    restart: unless-stopped

volumes:
  sonmi-data:
